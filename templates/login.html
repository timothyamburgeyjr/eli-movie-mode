<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Movie Mode — Sign in</title>
    <style>
        :root {
            --bg-deep: #0a0a0f;
            --bg-surface: #12121c;
            --bg-elevated: #1a1a2e;
            --border: #252535;
            --text-primary: #e8e8ee;
            --text-secondary: #999;
            --text-muted: #555566;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --danger: #ef4444;
            --success: #22c55e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg-deep); color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh; min-height: 100dvh;
            display: flex; align-items: center; justify-content: center;
            padding: 24px;
        }
        .login-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 28px 24px;
            width: 100%;
            max-width: 340px;
            display: flex; flex-direction: column; gap: 14px;
        }
        .logo { font-size: 2.2rem; text-align: center; }
        h1 { font-size: 1.15rem; text-align: center; font-weight: 700; }
        .subtitle {
            font-size: 0.72rem; color: var(--text-muted);
            text-align: center; line-height: 1.5;
        }
        label {
            font-size: 0.68rem; color: var(--text-secondary);
            text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600;
            margin-bottom: 4px; display: block;
        }
        input[type="password"] {
            width: 100%;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--text-primary);
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
        }
        input[type="password"]:focus { border-color: var(--accent); }
        button[type="submit"] {
            padding: 11px 20px;
            border-radius: 10px;
            background: var(--accent);
            border: none;
            color: #fff;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
            margin-top: 4px;
        }
        button[type="submit"]:hover { background: var(--accent-hover); }
        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--danger);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.78rem;
        }
        .first-run-note {
            background: rgba(99, 102, 241, 0.08);
            border: 1px solid rgba(99, 102, 241, 0.2);
            color: var(--accent);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.72rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <form class="login-card" method="post" action="/login">
        <div class="logo">🎬</div>
        <h1>Movie Mode</h1>
        {% if first_run %}
        <div class="subtitle">First-time setup — choose a password to protect this dashboard.</div>
        <div class="first-run-note">This password protects your session at movie.amburgey.dev. Store it somewhere safe.</div>
        {% else %}
        <div class="subtitle">Sign in to continue.</div>
        {% endif %}

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <div>
            <label for="password">{% if first_run %}New password{% else %}Password{% endif %}</label>
            <input id="password" type="password" name="password" autocomplete="{% if first_run %}new-password{% else %}current-password{% endif %}" required autofocus>
        </div>

        {% if first_run %}
        <div>
            <label for="confirm">Confirm password</label>
            <input id="confirm" type="password" name="confirm" autocomplete="new-password" required>
        </div>
        {% endif %}

        <button type="submit">{% if first_run %}Set password & continue{% else %}Sign in{% endif %}</button>
    </form>
</body>
</html>
